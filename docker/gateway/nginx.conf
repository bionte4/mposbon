# Single entrypoint for cloud / on-prem: SPA + /api → NestJS.
# Decoupled origins still work if clients hit :8080 / :3000 directly;
# same-origin /api/v1 avoids CORS for the default gateway path.

upstream bonpos_api {
  server api:3000;
}

upstream bonpos_web {
  server web:80;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;

  # API (Nest global prefix api/v1)
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
    proxy_set_header X-User-Id $http_x_user_id;
    proxy_set_header X-User-Email $http_x_user_email;
    proxy_pass http://bonpos_api;
  }

  # SPA (Vue router history mode)
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://bonpos_web;
  }
}
